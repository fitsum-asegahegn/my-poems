<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>የፍቅር ግጥሞቼ — Fitsum's Poems</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap');

  :root {
    --parchment: #EFE3C6;
    --parchment-dark: #E2D2A8;
    --ink: #2E2013;
    --ink-soft: #5A4A34;
    --gold: #A87B22;
    --gold-bright: #C99A3E;
    --red: #8B2A22;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #1B140C;
    color: var(--ink);
    font-family: 'Noto Serif Ethiopic', serif;
  }

  body {
    background: radial-gradient(ellipse at top, #241B10 0%, #14100A 70%);
    min-height: 100vh;
  }

  .hero { text-align: center; padding: 30px 20px 18px; color: var(--parchment); }
  .hero .kicker {
    font-family: 'EB Garamond', serif; font-style: italic; letter-spacing: 3px;
    font-size: 13px; color: var(--gold-bright); text-transform: uppercase; margin-bottom: 10px;
  }
  .hero h1 { font-size: clamp(26px, 5.5vw, 44px); margin: 0 0 8px; font-weight: 700; letter-spacing: 0.5px; }
  .hero .sub {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px;
    color: #C9B98E; max-width: 480px; margin: 0 auto; line-height: 1.5;
  }
  .hero .ornament { font-size: 18px; color: var(--gold-bright); margin: 10px 0 0; letter-spacing: 12px; }

  .index {
    max-width: 760px; margin: 0 auto 16px; padding: 0 20px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 7px;
  }
  .index button {
    font-family: 'EB Garamond', serif; font-size: 12.5px; color: var(--parchment);
    background: transparent; text-decoration: none; border: 1px solid rgba(201,154,62,0.5);
    padding: 5px 11px; border-radius: 99px; transition: all .15s ease; white-space: nowrap; cursor: pointer;
  }
  .index button:hover { background: rgba(201,154,62,0.15); border-color: var(--gold-bright); }
  .index button.active { background: rgba(201,154,62,0.25); border-color: var(--gold-bright); color: #fff; }

  .book-wrap { display: flex; flex-direction: column; align-items: center; margin: 0 auto 16px; padding: 0 16px; }
  .book-stage { perspective: 2400px; width: min(680px, 94vw); }
  .book {
    position: relative; width: 100%;
    height: min(88vh, 920px);
    height: min(88svh, 920px);
    min-height: 480px;
    transform-style: preserve-3d;
  }
  .book-shadow {
    width: 84%; height: 24px; margin: 14px auto 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, transparent 72%);
    filter: blur(2px);
  }

  .page {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform 0.85s cubic-bezier(.45,.05,.35,1), z-index 0.01s ease 0.84s;
    border-radius: 3px 12px 12px 3px;
    box-shadow: 2px 18px 38px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .page.flipped { transform: rotateY(-178deg); }

  .page-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: inherit; overflow: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.25), transparent 40%),
      linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  }
  .page-back { transform: rotateY(180deg); }
  .page-back .watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 90px; color: rgba(168,123,34,0.16);
  }

  .page-face::before { content: ""; position: absolute; inset: 12px; border: 1.5px solid var(--gold); pointer-events: none; }
  .page-face::after { content: ""; position: absolute; inset: 17px; border: 1px solid rgba(168,123,34,0.45); pointer-events: none; }

  .spine-shade {
    position: absolute; top: 0; bottom: 0; left: 0; width: 26px;
    background: linear-gradient(to right, rgba(0,0,0,0.28), transparent);
    pointer-events: none;
  }

  .corner { position: absolute; width: 30px; height: 30px; color: var(--gold); font-size: 20px; line-height: 1; opacity: 0.8; }
  .corner.tl { top: 8px; left: 8px; }
  .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .corner.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }

  .page-content { position: absolute; inset: 20px 20px; overflow-y: auto; text-align: center; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

  .poem-number {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 11.5px; letter-spacing: 1.5px;
    color: var(--gold); text-transform: uppercase; margin-bottom: 4px; min-height: 1px;
  }
  .poem-number:empty { margin-bottom: 0; }
  .poem-title { color: var(--red); font-size: clamp(17px, 2.8vw, 24px); font-weight: 700; margin: 0 0 10px; }
  .poem-title .flourish { display: block; color: var(--gold); font-size: 11px; margin-top: 4px; letter-spacing: 6px; }
  .poem-title .en-toggle {
    display: inline-block;
    font-size: 11px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    background: rgba(168,123,34,0.2);
    border: 1px solid var(--gold);
    border-radius: 99px;
    padding: 2px 10px;
    margin-left: 8px;
    cursor: pointer;
    color: var(--gold);
    transition: all .2s ease;
    vertical-align: middle;
  }
  .poem-title .en-toggle:hover {
    background: rgba(168,123,34,0.35);
  }
  .poem-title .en-toggle.active {
    background: var(--gold);
    color: var(--ink);
  }
  .poem-body { white-space: pre-wrap; font-size: 16px; line-height: 1.85; color: var(--ink); }
  .poem-body.en { display: none; }

  .tap-hint {
    position: absolute; bottom: 10px; right: 14px;
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 11px; color: rgba(90,74,52,0.55);
  }

  .controls { display: flex; align-items: center; gap: 20px; margin-top: 22px; }
  .nav-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--gold);
    background: rgba(201,154,62,0.08); color: var(--parchment); font-size: 20px;
    cursor: pointer; transition: all .15s ease; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: rgba(201,154,62,0.22); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .page-indicator { font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px; color: #C9B98E; min-width: 60px; text-align: center; }

  .share-row { display: flex; justify-content: center; margin-top: 16px; }
  .share-btn {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px;
    background: transparent; border: 1px solid rgba(201,154,62,0.5); color: #C9B98E;
    padding: 6px 16px; border-radius: 99px; cursor: pointer; transition: all .15s ease;
  }
  .share-btn:hover { background: rgba(201,154,62,0.12); }

  /* ── COVER PAGE STYLES ── */
  .cover-page {
    background: radial-gradient(circle at 15% 10%, rgba(255,255,255,0.2), transparent 50%),
                linear-gradient(160deg, #EFE3C6 0%, #E2D2A8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 30px;
    position: relative;
    min-height: 100%;
  }
  .cover-page .ornament-top {
    font-size: 24px;
    color: #A87B22;
    letter-spacing: 20px;
    margin-bottom: 20px;
  }
  .cover-page .main-title {
    font-size: clamp(28px, 5.5vw, 48px);
    font-weight: 700;
    color: #8B2A22;
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .cover-page .subtitle {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(13px, 1.6vw, 18px);
    color: #5A4A34;
    max-width: 400px;
    line-height: 1.6;
    margin-bottom: 30px;
  }
  .cover-page .author {
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 600;
    color: #2E2013;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .cover-page .year {
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    color: #A87B22;
    letter-spacing: 6px;
  }
  .cover-page .ornament-bottom {
    font-size: 20px;
    color: #A87B22;
    letter-spacing: 16px;
    margin-top: 24px;
  }
  .cover-page::before {
    content: '';
    position: absolute;
    inset: 16px;
    border: 2px solid #A87B22;
    pointer-events: none;
    border-radius: 2px;
  }
  .cover-page::after {
    content: '';
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(168,123,34,0.4);
    pointer-events: none;
    border-radius: 2px;
  }
  .cover-corner {
    position: absolute;
    font-size: 22px;
    color: #A87B22;
    opacity: 0.8;
  }
  .cover-corner.tl { top: 12px; left: 12px; }
  .cover-corner.tr { top: 12px; right: 12px; transform: scaleX(-1); }
  .cover-corner.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
  .cover-corner.br { bottom: 12px; right: 12px; transform: scale(-1,-1); }

  .site-footer {
    text-align: center; padding: 14px 20px 30px; color: #8a7a5c;
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px;
  }
  .site-footer .signature { color: var(--gold-bright); font-size: 15px; margin-bottom: 4px; letter-spacing: 1px; }

  @media (max-width: 480px) {
    .book { height: min(86vh, 800px); height: min(86svh, 800px); }
  }
</style>
</head>

  <div class="site-footer">

  { tag: null, title: "ፍቄ እና ገረመው", body: `ታሪክ ልንገራችሁ ስሙኝ ላጫውታችሁ

ደስታ እያናወጠው ወደ ቤት በረረ
አልነጋለት ብሎ ቁጭ ብሎ አደረ
መንጋቱ አይቀርም ዛሬ ነገን ተካ

  { tag: "5", title: "እንታረቅ", body: `አንቺን ሳላወራ 1,2 ቀን ባድር፣
ዞረብኝ አለሙ ላብድልሽ ነው ፍቅር፣
ምንም ብታኮርፊኝ ምንም ባስቀይምሽ፣
እንዲ ይጨከናል በእኔ ውዱ ባልሽ።
እንቅልፏማ ሚስቴ አኩራፊዋ ሚስቴ፣
አንቺን ሳወራ አይደል እንደው የሚቀለኝ ሀሳቤ ጭንቀቴ፣
ቶሎ እንደሚከፋኝ እኔን እያወቅሺኝ፣
አጉል አስለምደሽ ለምን ጠፋሽብኝ።
ላደረኩት ነገር ላጠፋሁት ጥፋት፣
ፈልጊና ደግሞ የሚገባ ቅጣት፣
ይሄን መሰናክል እንለፈው እናት፣
አላጠፋም ዳግም ብዬ ብምልልሽ፣
እንዴት ደስ ባለኝ ሳላጠፋ ብኖር መቼም ሳላስከፋሽ።
እንዳለፈው ጊዜ ልክ እንደ ልጅነት፣
ምንም ባልተነካ በንፁህ ማንነት፣
እንዳልተታረቅን ሊያውም በትንሿ በዚያች በማርያም ጣት፣
አሁንም ደግሞ አድገን በትንሿ ጣትሽ በትንሿ ጣቴ፣
መኳረፉን ትተን እንታረቅ ሚስቴ።
ይቅርታ፣ይቅርታ፣አሁንም ይቅርታ፣
የልቤን ባይገልፅም የቃላት ጋጋታ፣
ይቅርታ፣ይቅርታ፣አሁንም ይቅርታ🙏` },
  { tag: "6", title: "መለማመጥ እሷን", body: `መለማመጥ እሷን ይሄን ክፉ ልማድ
ሁልጊዜ ሚወስደኝ እንደ እግረኛ መንገድ
ቀዩ መብራት በርቶ ቆሚያለሁ ዜብራው ላይ
ግራ አጋብቶኝ ፍቅሯ ሽው ሲል ልቤ ላይ።
ብጨፍነው ልቤን እንዴት ደስ ባለኝ
እኔ እያፈቀርኳት ከሌላ ስትገኝ
ለምንስ አቃተኝ እንድትወደኝ ማድረግ
ይሄን ያህል ለእሷ እንዲ ማጎበድድ እንዲ ማሸረግድ
ስለሚመስለኝ ነው ህይወት አገናኝታን ደግመን ምንዋደድ
ስለሚመስለኝ ነው አረንጓዴው በርቶ በፍቅር የምንነጉድ።

ከእሱ ጋር መዋሏ ስለ እሱ ማሰቧ
እኔን ላለማጣት ባይቆርጥላት ልቧ
ባጣቆዩኝ አርጋ እኔኑ ካሰበች
ንፁህ ልቤን ስሰጥ ትታኝም ከሄደች

በሰጠቺኝም ብር ማኪያቶ አዝዤ ካፌ ቁጭ ብዬ
እኔም እያሰብኩኝ ያየሁትን ቅዠት
ቀኑን አሳለፍኩት ስሞክር ለመፍታት
አቤትም ስገባ ለ እናቴ ነገርኳት
ህልምስ ነው ወይ ቅዠት
በጥያቄ ብዛት እኔም አጣደፍኳት።
ጥያቄዎቼንም በደንብ አዳመጠች
   ይሄንን መለሰች
ህይወት ካስተማረኝ ስሞክር ለመፍታት
ያየኸውም ነገር ህልም አይሉት ቅዠት
እስኪ ልጄ ስማኝ ነው እንዲህ እንደማለት
ይታለባል ማለት ከዶሮዋም ወተት
ስንዴ ያፈራል ብሎ ሽንብራን መኮትኮት
ንስሐ ሳትገባ ገነትን መመኘት
አንተ ያየኸውም ልክ አንደዚህ አይነት
ብዙም አትልፋ ይሄንን ለመፍታት
እሱም ስለሆነ ዝም ብሎ አጉል ምኞት።
ከነገረቺኝም እኔ የተረዳሁት
ስራንም ለመፍታት ምክንያት አለማጣት
አንዴ እያሉ ቅዠት ካፌም ቁጭ ማለት
በሆነው ባልሆነው ጊዜአችንን ማጥፋት
ስራንም ሳይሰሩ ማለምም ትልቅ ሀብት
ምንም የማይጠቅም ነውም አጉል ምኞት።` },
  { tag: "14", title: "ፎቶ ማልነሳው 📸", body: `ያረጀ ቢመስልም ውቡ አለባበስሽ
ማማርሽን አይቶ ወንደ ሀሉ ቢከብሽ
እኔን ለመማረክ ብዙ ነው ሚቀርሽ።
ብዙ ቢወራልሽ ስላንቺ ቁንጅና
ቢቀደዱልኝም እከሌ ና እንትና
አንቺን እያየሁሽ እዝናናለሁ ገና።
ስለምወድሽ ነው እባክሽ ውድዬ
ስንደዶ ሚመስለው ሰልካካ አፍንጫዬ
ፈራው አንዳይደብቀው  ያንቺን ውበት ብዬ
ፀጉሬስ ብትዪ ሀርን የሚመስለው
ያንቺን ኪንኪ ፀጉር በጣም የሚያስንቀው
እንዲህ የምለፋው እንዲህ የምጥረው 
በሀሜተኞች አፍ እንዳትወድቂብኝ ነው
ለእሷ አይመጥንም እሱኮ ቆንጆ ነው
ደረጃዋን ትወቅ እንዳትባዪ ነው
ፎቶ ማልነሳው ሰለምወድሽ ነው።` },
  { tag: "16", title: "የፍቅርሽ ነበልባል ❤️‍🔥", body: `የ ፍቅርሽ ነበልባል እሳቱ ሲገርፈኝ
ልቤ እንደዚ ሲቀልጥ ትንሽ እንዲቀለኝ
አንቺኑ እያሰብኩ ይሄን ግጥም ፃፍኩኝ።

ናፍቆት እንደ ንፋስ ግለቱን ሲያብሰው
ልቤ እየቀለጠም አንቺን ነው የሚያስበው
ናፍቆትሽ በርትቶ ሲበዛ ቃጠሎው
የፀሐዩ ንዳድ እሱም ተጨምሮ
ከውስጥም ከውጪም እኔን ሲያቃጥለኝ
ደሞዜን ጠብቀሽ ስትመጪም ቢከፋኝ
ምንም ማድረግ ባልችል ሱሴ ሆነሽብኝ
እጄም ባዶ ሲሆን ስትሄጂ ትተሺኝ
ሁልግዜ እያልኩሽ ቶሎ ድረሺልኝ
ልጠብቅሽ እንጂ ምን አማራጭ አለኝ።

እንደዚ እንድኖር አንቺው ፈርደሺብኝ
ምን ጣፋጭ ብትሆኚ እውነቱ ቢመረኝ
በእጆቼ ስይዝሽ ሙቀቱ እንዲለቀኝ
ዝም ብዬ ከምኖር እንደዚ እየሆንኩኝ
እባክሽ ነይ እና ናፍቆትሽ ይውጣልኝ።

ከማረሬ በፊት ሳልስሽ አልቀርም
በጣም እወድሻለሁ ጣፋጯ አይስክሬም።` },
  { tag: "17", title: "እኔ የምሄደው...", body: `ግጥሜ ናፍቋት ነው?
እሷን ወድጃት ነው?
ለኔስ መጥናኝ ነው?
ስለምትወደኝ ነው?
ወይስ ለማጥናት ነው?
ምከንያቱ ምንድን ነው?
እሷ ጋር ምሄደው እኔ ለምንድን ነው
በሁለቱ ፍቅር ላይ ላለመራመድ ነው
ትንቢተ ፍጹም ን ለማስፈፀምም ነው።
ወንጌል ወንጀል ሆና ወንበሩ ቢያስረኝም
ተጠርጣሪ ብባል ለኔም ቢገርመኝም
እኔ ወድጄ ነው እኔ ፈልጌ ነው
ለነሱ ፍቅር ስል መስዋዕት መሆኔ ነው
ለዚህ ሚያምር ፍቅር መንገድ መክፈቴ ነው
ነው የበዛበትን ግጥምም ምፅፈው።
እኔን የገረመኝ ከመጠርጠሬ ይልቅ
የነሱ መዋደድ እንደዚህ በዚ ልክ
ሰባተኛው ፔሬድ ትንቢቱን ቢያሳካ
ድሮም ከዚህ ቀድሞ ነበር አልቋል ለካ።
አልቋል ብዬ ነበር
ራሴን ሳታልል ላሽ ብዬ ስበርር
አሷ የምትሄደው
ባስኬት ለማየት ነው?
ሜዳው መስጧት ነው?
ወይ ለመጫወት ነው?
ምክንያቱ ምንድንነው?
ሜዳው ጋር ምትሄደው እሱን ለማየት ነው
ሀሁ ብላ ፍቅርን ለመጀመርም ነው
ይህም አለፈና...
እንደተለመደው እሱ እሷን ጀንጅኖ
በቅቤ ምላሱ እትትትትትት ብሎ።
ትንሽ እንደቆዩ የራሱ አደረጋት
በሚያምር ፍቅር ውስጥ አሳለፉ ወራት።
ልደቱን አክብራ የእሷን ግን ረስቶ
ይሄ የማይረባ ይሄ የሰው ጉቶ
ወደ እዚያ መጣል ነው በእርግጫ መቶ።
አሳልፈው ከርመው አንድላይ ለ 1 አመት
ቀጣዩን ስድስት ወር ሊጨማለቅባት
መች እሷ አወቀች እንዲህ እንደሚያደርጋት
ስድስት ወር በሙሉ ለእሷ ጊዜ ሳይሰጥ
ምንም ሳይሰማው ignore እየገጫት
ታግሳ አሳልፋ አንድ ቀን ቢመራት
ና እስኪ ቁጭ ብለን አንዴ እናውራበት
አለችው እና ድንገት...
ምን እንደሚሰማው ከእራሱ ለመስማት
ልጁ ግን ሲሰማው ዱብዳ ሆነበት
ተኮለታተፈ ሚያወራው ጠፋበት
ለካስ...
አላርፍ ያለ አይኑ ደግሞ ሌላ አይቶ
እንዲያ የለፋችበትን ሁሉ መና ከቶ
ሌላዋ ጋር ሄደ ይቺኛዋን ረስቶ።
ፍቅር እንደዚህ ነው ካለ ይህ ሰውዬ
እስኪ አንደ እንበለው ህፃኑ ማሙዬ።
ጡጦ እንስጠው እንጂ ለዚህ ምንም ማያውቅ
አእምሮው ቀጭጮ የሰው ልብ የሚያደርቅ
ይሄ ንገሩኝ ባይ አስመሳይ ጭምልቅ
የማይረባ ዝተት የሰው ልክ የማያውቅ።
ያለማወቅ ጥጉ የታለ ካላቹ
ናቲ ይባላል ልጁ ገላን አለላችሁ።` },
  { tag: "18", title: "እናቴ 🥰", body: `ዘጠኝ ወር በሙሉ እኔን ተሸክመሽ
3 ቀን ሙሉ አምጠሽ ተጨንቀሽም ወልደሽ
ጡትሽን አጥብተሽ አቅፈሽ አሳድገሽ
የደረደርኳቸው ቃላቶች ባይገልጹሽ
እስኪ ትንሽ ልበል ማለቂያ ከሌለው ከብዙ ውለታሽ
​ካሉት ሁሉ ቀናት ዛሬን መረጠና
እናቴን አሳየኝ ከራሷ አወጣና
​በዛሬዋ ቀንም ቢከበር ልደቴ
ለእናቶች ቀንም ብዬ በአንደበቴ
እንኳን አደረሰሽ እምዬ እናቴ
የዛሬዋ ቀንም የእኔ ብቻ አይደለች
የእኔ እና ያንቺ የጋራችንም ነች
​አጠገቤ ባይኖር አባቴ ቢሞት
አንገቴን አልደፋ ለአንዲት ቅጽበት
ምክንያቱም እሱን የሚተካ አለችኝ እናት
በጣም እወድሻለሁ እስከ ዕለተ ሞቴ
ለዘላለም ቆዪ ኑሪልኝ እናቴ🥰` },
  { tag: "19", title: "ሄ ልቤ", body: `ምንም ማይበግረኝ ነበርኩኝም ብርቱ
ግን በጣም ይለያሉ እነዚህም ሶስቱ
በዚህ በአለማችን ካሉት ሁሉ ሴቱ።
እንደዚህ ስናገር የተውኳት መስሏችሁ
አብዷል እንዳትሉኝ እናቱን ረሳ ብላችሁ።
ይሄን ትልቅ ነገር እማዬ እናቴን ልረሳ
ይቀላል ትልቁ ተራራ ኤቨረስት ቢነሳ።
ብፈልግ ብኳትን ሆና ፊትለፊቴ
እሷንም አገኘሁ አልኳትም ልዕልቴ።

  { tag: "22", title: "አወይ አበባዬ 🌼", body: `እንኳን አደረሰሽ ልልሽ ስመጣ እኔ

  { tag: "29", title: "እስኪ ረጋ...", body: `ለምን ታሾፋለህ በሕይወት?

  { tag: "30", title: "ተምረናል አሉ", body: `ተማርኩ የሚለውን KT² ን እዩት

ያለ አንዳች ጥናት በፈተና ቀን ብቻ የምናገኝህ።
  
  
ኩሩው ስፓርተኛ ስማቸው ሙሉአለም  
በጉልበት  በጽናት እንዳንተ ያለ የለም::
  
ከፍተኛ ውጤት ያለው ዝምተኛው ደርበው፣
ዝም ብሎ  በለሆሳስ ማርክ የሰበስበው።


ቀጭኑ ዮሴፍ በዛብህ እኛ እንደምናውቀው፣
ክፍሉን በቅጥነት ያደመቀው እሱ ነው።


መላኩ ዝምተኛው ሰውን አክባሪ መልካም ወንድማችን፣
በአክብሮቱ የታወቀው የክላስ ጓዳችን
 
  
ዘአማን ሁልጊዜ ከቤት እየሮጠ አርፍዶ የሚመጣው፣
የሩጫው ሻምፒዮን ሰዓቱን ሳያከብር አመቱ ያለቀው።
  

ሚካኤል ተስፉ ደግ እና ቀናኢ የሁላችን ወንድም፣
የአንተን መልካም ጸባይና አንረሳውም መቼም።

ታማኙ ቴዎድሮስ መሳፍንት የክፍላችን የልብ አውራ፣
በትሕትናውና በመልካምነቱ ሁሌም የሚመገን በሚሰራው ሥራ።
 
  
ስድስት ቀናት ብቻ ቀርተውናል ለዚህ ታላቅ ቀን፣
አምላክ በሰላም አድርሶ ለምርቃት ያብቃን።
ቤተ ገብርኤል ዘ Stat ብለን የጀመርነው ሕብረት፣
በትዝታ ደምቆ እነሆ ደረሰ ለፍጻሜው እለት።
​አመቱ ሲያልቅ ተሰነባብተን ከግቢው ብንወጣም፣
በክላሳችን ውስጥ ያለፈው ትዝታ መቼም አይረሳም።
በፈተናው፣ በጭንቀቱ፣ በቀልዱና በዝክሩ የጸናው ፍቅራችን፣
የነገው የሕይወት ጎዳናችንን ያሳምረው አምላካችን።
​ለእያንዳንዳችን ስኬት፣ ሰላም እና ብሩህ ተስፋን እየተመኘሁ፣
በቅዱስ ገብርኤል ጥበቃ ነገአችን እንዲያምር ሁሌ እጸልያለሁ።` },
];

/* ─── BUILD PAGES ─── */
const PAGES = [];
const MAX_LINES_PER_PAGE = 24;
const firstPageIndexForPoem = [];

function chunkBody(body) {
  if (!body) return [];
  const paragraphs = body.split(/\n\s*\n/);
  const units = [];
  paragraphs.forEach((p) => {
    const lines = p.split("\n");
    if (lines.length > MAX_LINES_PER_PAGE) {
      for (let i = 0; i < lines.length; i += MAX_LINES_PER_PAGE) {
        units.push(lines.slice(i, i + MAX_LINES_PER_PAGE).join("\n"));
      }
    } else {
      units.push(p);
    }
  });

  const chunks = [];
  let current = [];
  let currentLines = 0;
  units.forEach((u) => {
    const uLines = u.split("\n").length;
    if (currentLines + uLines > MAX_LINES_PER_PAGE && current.length > 0) {
      chunks.push(current.join("\n\n"));
      current = [];
      currentLines = 0;
    }
    current.push(u);
    currentLines += uLines + 1;
  });
  if (current.length) chunks.push(current.join("\n\n"));
  return chunks.length ? chunks : [body];
}

RAW_POEMS.forEach((poem, poemIndex) => {
  const isCover = poem.isCover || false;
  firstPageIndexForPoem[poemIndex] = PAGES.length;

  if (isCover) {
    PAGES.push({ poemIndex, tag: null, title: "የፍቅር ግጥሞቼ", body: "", isCover: true, part: 0, totalParts: 1 });
    return;
  }

  const chunks = chunkBody(poem.body);
  chunks.forEach((chunk, partIndex) => {
    PAGES.push({
      poemIndex,
      tag: poem.tag,
      title: poem.title,
      body: chunk,
      isCover: false,
      part: partIndex + 1,
      totalParts: chunks.length,
    });
  });
});

/* ─── RENDER ─── */
const book = document.getElementById("book");
const nav = document.getElementById("indexNav");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const pageIndicator = document.getElementById("pageIndicator");
const shareBtn = document.getElementById("shareBtn");
let current = 0;
const pageEls = [];

// Build navigation
RAW_POEMS.forEach((poem, poemIndex) => {
  if (poem.isCover) return;
  const cleanTitle = poem.title.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").trim();
  const label = (poem.tag ? poem.tag + ". " : "") + cleanTitle;
  const navBtn = document.createElement("button");
  navBtn.textContent = label;
  navBtn.addEventListener("click", () => goTo(firstPageIndexForPoem[poemIndex]));
  navBtn.dataset.poemIndex = poemIndex;
  nav.appendChild(navBtn);
});

// Create pages
PAGES.forEach((pg, i) => {
  const isCover = pg.isCover || false;
  const numberLabel = isCover ? "" : [
    pg.tag ? "No. " + pg.tag : "",
    pg.totalParts > 1 ? "ክፍል " + pg.part + "/" + pg.totalParts : "",
  ].filter(Boolean).join(" · ");

  const page = document.createElement("div");
  page.className = "page";
  page.style.zIndex = PAGES.length - i;

  if (isCover) {
    page.innerHTML = `
      <div class="page-face page-front">
        <span class="cover-corner tl">❦</span>
        <span class="cover-corner tr">❦</span>
        <span class="cover-corner bl">❦</span>
        <span class="cover-corner br">❦</span>
        <div class="cover-page">
          <div class="ornament-top">❦ ❦ ❦</div>
          <div class="main-title">የፍቅር ግጥሞቼ</div>
          <div class="subtitle">ናፍቆት፣ ፍቅር እና ትዝታ<br>በቃላት የተነገሩበት</div>
          <div class="author">ፍጹም አሠገኝ</div>
          <div class="year">✦ 2026 ✦</div>
          <div class="ornament-bottom">❦ ❦ ❦</div>
        </div>
        <div class="spine-shade"></div>
        <div class="tap-hint">tap to open ✦</div>
      </div>
      <div class="page-face page-back">
        <div class="watermark">❦</div>
      </div>
    `;
  } else {
    // Check if this poem has an English version (poem 25)
    const hasEn = pg.tag === "25";
    page.innerHTML = `
      <div class="page-face page-front">
        <div class="corner tl">❦</div>
        <div class="corner tr">❦</div>
        <div class="corner bl">❦</div>
        <div class="corner br">❦</div>
        <div class="page-content">
          <div class="poem-number">${numberLabel}</div>
          <div class="poem-title">
            ${pg.title}
            ${hasEn ? `<span class="en-toggle" data-poem="${pg.tag}">EN</span>` : ''}
            <span class="flourish">❧</span>
          </div>
          <div class="poem-body am">${pg.body}</div>
          ${hasEn ? `<div class="poem-body en" style="display:none;">${RAW_POEMS.find(p => p.tag === "25en")?.body || ''}</div>` : ''}
        </div>
        <div class="spine-shade"></div>
        <div class="tap-hint">tap to turn ›</div>
      </div>
      <div class="page-face page-back">
        <div class="watermark">❦</div>
      </div>
    `;

    // EN toggle event
    if (hasEn) {
      const toggle = page.querySelector('.en-toggle');
      if (toggle) {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const am = page.querySelector('.poem-body.am');
          const en = page.querySelector('.poem-body.en');
          if (am && en) {
            const showingAm = am.style.display !== 'none';
            am.style.display = showingAm ? 'none' : 'block';
            en.style.display = showingAm ? 'block' : 'none';
            toggle.textContent = showingAm ? 'አማ' : 'EN';
            toggle.classList.toggle('active', showingAm);
          }
        });
      }
    }
  }

  page.addEventListener("click", (e) => {
    const rect = page.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width / 2) next(); else prev();
  });
  book.appendChild(page);
  pageEls.push(page);
});

/* ─── LAYOUT (Bug Fixed) ─── */
function layout() {
  // First set z-index for all pages (no transition)
  pageEls.forEach((page, i) => {
    if (i < current) {
      page.style.zIndex = i;
    } else {
      page.style.zIndex = PAGES.length - i;
    }
  });

  // Then toggle flipped class (triggers transition)
  requestAnimationFrame(() => {
    pageEls.forEach((page, i) => {
      if (i < current) {
        page.classList.add("flipped");
      } else {
        page.classList.remove("flipped");
      }
    });
  });

  pageIndicator.textContent = (current + 1) + " / " + PAGES.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PAGES.length - 1;

  const activePoemIndex = PAGES[current]?.poemIndex;
  document.querySelectorAll(".index button").forEach((b) => {
    b.classList.toggle("active", parseInt(b.dataset.poemIndex, 10) === activePoemIndex);
  });
}

/* ─── TEXT FITTING ─── */
function fitPageText(page) {
  const content = page.querySelector(".page-content");
  const body = page.querySelector(".poem-body.am") || page.querySelector(".poem-body");
  if (!content || !body) return;

  body.style.fontSize = "";
  body.style.lineHeight = "";
  const maxSize = parseFloat(getComputedStyle(body).fontSize);
  const baseLineHeight = 1.85;
  let size = maxSize;
  let guard = 0;

  while (content.scrollHeight > content.clientHeight + 1 && size > 12.5 && guard < 60) {
    size -= 0.5;
    body.style.fontSize = size + "px";
    guard++;
  }

  let lh = baseLineHeight;
  guard = 0;
  while (content.scrollHeight > content.clientHeight + 1 && lh > 1.4 && guard < 30) {
    lh -= 0.05;
    body.style.lineHeight = lh.toFixed(2);
    guard++;
  }
}

function fitAllPages() {
  pageEls.forEach((page) => {
    // Skip cover page
    if (page.querySelector(".cover-page")) return;
    fitPageText(page);
  });
}

/* ─── NAVIGATION ─── */
function next() { if (current < PAGES.length - 1) { current++; layout(); fitPageText(pageEls[current]); } }
function prev() { if (current > 0) { current--; layout(); fitPageText(pageEls[current]); } }
function goTo(i) { current = Math.max(0, Math.min(PAGES.length - 1, i)); layout(); fitPageText(pageEls[current]); }

prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
  if (e.key === " " || e.key === "Space") { e.preventDefault(); next(); }
});

// Touch support
let touchStartX = null;
book.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
book.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
  touchStartX = null;
}, { passive: true });

/* ─── SHARE ─── */
shareBtn.addEventListener("click", async () => {
  const pg = PAGES[current];
  if (!pg || pg.isCover) {
    showToast("📖 This is the cover — open a poem first to share it.");
    return;
  }
  const poem = RAW_POEMS[pg.poemIndex];
  if (!poem || poem.isCover) {
    showToast("📖 Open a poem first to share it.");
    return;
  }
  const text = poem.title + "\n\n" + poem.body;
  if (navigator.share) {
    try { await navigator.share({ title: poem.title, text: text }); return; } catch (e) {}
  }
  try {
    await navigator.clipboard.writeText(text);
    const old = shareBtn.textContent;
    shareBtn.textContent = "Copied ✓";
    setTimeout(() => (shareBtn.textContent = old), 1400);
  } catch (e) {}
});

/* ─── TOAST ─── */
function showToast(msg) {
  const old = shareBtn.textContent;
  shareBtn.textContent = msg;
  setTimeout(() => (shareBtn.textContent = old), 2000);
}

/* ─── INIT ─── */
layout();

window.addEventListener("load", fitAllPages);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(fitAllPages);
}
let resizeTimer;
function scheduleFit() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitAllPages, 120);
}
window.addEventListener("resize", scheduleFit);
window.addEventListener("orientationchange", scheduleFit);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", scheduleFit);
}
if (window.ResizeObserver) {
  new ResizeObserver(scheduleFit).observe(book);
}
setTimeout(fitAllPages, 50);
setTimeout(fitAllPages, 400);
</script>
</body>
