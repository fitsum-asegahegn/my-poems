<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>የፍቅር ግጥሞች — Fitsum's Poems</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap');

  :root {
    --parchment: #EFE3C6;
    --parchment-dark: #E2D2A8;
    --ink: #2E2013;
    --ink-soft: #5A4A34;
    --gold: #A87B22;
    --gold-bright: #C99A3E;
    --red: #8B2A22;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #1B140C;
    color: var(--ink);
    font-family: 'Noto Serif Ethiopic', serif;
  }

  body {
    background: radial-gradient(ellipse at top, #241B10 0%, #14100A 70%);
    min-height: 100vh;
  }

  .hero { text-align: center; padding: 30px 20px 18px; color: var(--parchment); }
  .hero .kicker {
    font-family: 'EB Garamond', serif; font-style: italic; letter-spacing: 3px;
    font-size: 13px; color: var(--gold-bright); text-transform: uppercase; margin-bottom: 10px;
  }
  .hero h1 { font-size: clamp(26px, 5.5vw, 44px); margin: 0 0 8px; font-weight: 700; letter-spacing: 0.5px; }
  .hero .sub {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px;
    color: #C9B98E; max-width: 480px; margin: 0 auto; line-height: 1.5;
  }
  .hero .ornament { font-size: 18px; color: var(--gold-bright); margin: 10px 0 0; letter-spacing: 12px; }

  .index {
    max-width: 780px; margin: 0 auto 16px; padding: 0 20px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .section-group {
    border: 1px solid rgba(201,154,62,0.25); border-radius: 12px;
    overflow: hidden; background: rgba(255,255,255,0.02);
  }
  .section-header {
    width: 100%; display: flex; align-items: center; gap: 10px;
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px;
    color: var(--gold-bright); letter-spacing: 1px;
    background: transparent; border: none; cursor: pointer;
    padding: 9px 14px; text-align: left;
  }
  .section-header:hover { background: rgba(201,154,62,0.08); }
  .section-header .chevron {
    font-style: normal; font-size: 11px; transition: transform .2s ease; color: var(--gold);
  }
  .section-group.expanded .section-header .chevron { transform: rotate(90deg); }
  .section-header-title { flex: 1; text-transform: uppercase; }
  .section-count {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a7a5c;
    background: rgba(255,255,255,0.05); padding: 1px 7px; border-radius: 99px;
  }
  .section-poems {
    display: none; flex-wrap: wrap; gap: 6px; justify-content: center;
    padding: 4px 12px 12px;
  }
  .section-group.expanded .section-poems { display: flex; }
  .section-poems button {
    font-family: 'EB Garamond', serif; font-size: 12px; color: var(--parchment);
    background: transparent; text-decoration: none; border: 1px solid rgba(201,154,62,0.5);
    padding: 5px 10px; border-radius: 99px; transition: all .15s ease; white-space: nowrap; cursor: pointer;
  }
  .section-poems button:hover { background: rgba(201,154,62,0.15); border-color: var(--gold-bright); }
  .section-poems button.active { background: rgba(201,154,62,0.25); border-color: var(--gold-bright); color: #fff; }

  .book-wrap { display: flex; flex-direction: column; align-items: center; margin: 0 auto 16px; padding: 0 16px; }
  .book-stage { perspective: 2400px; width: min(680px, 94vw); }
  .book {
    position: relative; width: 100%;
    height: min(88vh, 920px);
    height: min(88svh, 920px);
    min-height: 480px;
    transform-style: preserve-3d;
  }
  .book-shadow {
    width: 84%; height: 24px; margin: 14px auto 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, transparent 72%);
    filter: blur(2px);
  }

  .page {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform 0.85s cubic-bezier(.45,.05,.35,1);
    border-radius: 3px 12px 12px 3px;
    box-shadow: 2px 18px 38px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .page.flipped { transform: rotateY(-178deg); }

  .page-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: inherit; overflow: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.25), transparent 40%),
      linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  }
  .page-back { transform: rotateY(180deg); }
  .page-back .watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 90px; color: rgba(168,123,34,0.16);
  }

  .page-face::before { content: ""; position: absolute; inset: 12px; border: 1.5px solid var(--gold); pointer-events: none; }
  .page-face::after { content: ""; position: absolute; inset: 17px; border: 1px solid rgba(168,123,34,0.45); pointer-events: none; }

  .spine-shade {
    position: absolute; top: 0; bottom: 0; left: 0; width: 26px;
    background: linear-gradient(to right, rgba(0,0,0,0.28), transparent);
    pointer-events: none;
  }

  .corner { position: absolute; width: 30px; height: 30px; color: var(--gold); font-size: 20px; line-height: 1; opacity: 0.8; }
  .corner.tl { top: 8px; left: 8px; }
  .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .corner.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }

  .page-content { position: absolute; inset: 20px 20px; overflow-y: auto; text-align: center; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

  .poem-number {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 11.5px; letter-spacing: 1.5px;
    color: var(--gold); text-transform: uppercase; margin-bottom: 4px; min-height: 1px;
    display: flex; align-items: center; justify-content: center; gap: 8px; position: relative;
  }
  .poem-number:empty { margin-bottom: 0; }
  .poem-title { color: var(--red); font-size: clamp(17px, 2.8vw, 24px); font-weight: 700; margin: 0 0 10px; }
  .poem-title .flourish { display: block; color: var(--gold); font-size: 11px; margin-top: 4px; letter-spacing: 6px; }
  .poem-body { white-space: pre-wrap; font-size: 16px; line-height: 1.85; color: var(--ink); }

  .tap-hint {
    position: absolute; bottom: 10px; right: 14px;
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 11px; color: rgba(90,74,52,0.55);
  }

  .lang-toggle {
    position: absolute; top: 10px; left: 10px;
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 11px;
    background: rgba(168,123,34,0.14); border: 1px solid var(--gold); color: var(--ink-soft);
    padding: 3px 9px; border-radius: 99px; cursor: pointer; z-index: 3;
  }
  .lang-toggle:hover { background: rgba(168,123,34,0.28); }

  .heart-hat { position: relative; display: inline-block; }
  .hh-cap { position: absolute; top: -0.4em; left: 0.08em; font-size: 0.55em; transform: rotate(-18deg); }

  .cover-face { padding: 0; }
  .cover-face img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
  .cover-hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 12px;
    color: #F0E4C8; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    background: rgba(0,0,0,0.35); padding: 4px 14px; border-radius: 99px;
    pointer-events: none;
  }

  .search-row {
    max-width: 760px; margin: 0 auto 12px; padding: 0 20px;
    display: flex; justify-content: center; gap: 8px;
  }
  .search-input {
    font-family: 'Zen Kaku Gothic New', 'Noto Serif Ethiopic', sans-serif;
    font-size: 13px; padding: 8px 16px; border-radius: 99px;
    border: 1px solid rgba(201,154,62,0.5); background: #14100a; color: var(--parchment);
    outline: none; width: min(360px, 70%);
  }
  .search-input::placeholder { color: #8a7a5c; }
  .dim-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(201,154,62,0.5);
    background: transparent; color: var(--parchment); cursor: pointer; font-size: 15px;
    transition: all .15s ease;
  }
  .dim-btn:hover { background: rgba(201,154,62,0.15); }
  .dim-btn.active { background: rgba(201,154,62,0.3); border-color: var(--gold-bright); }
  body.dim-mode .book { filter: brightness(0.62) saturate(0.9); }

  .progress-track {
    width: min(300px, 70%); height: 4px; margin: 10px auto 0;
    background: rgba(201,154,62,0.18); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    border-radius: 99px; transition: width 0.3s ease;
  }

  .toc-face { }
  .toc-content { position: absolute; inset: 26px 22px; overflow-y: auto; text-align: left; }
  .toc-heading {
    text-align: center; color: var(--red); font-weight: 700;
    font-size: clamp(18px, 3vw, 24px); margin-bottom: 14px;
  }
  .toc-section-title {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 12.5px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold);
    margin: 14px 0 4px; border-bottom: 1px solid rgba(168,123,34,0.3); padding-bottom: 3px;
  }
  .toc-section-title:first-of-type { margin-top: 0; }
  .toc-entry {
    display: flex; justify-content: space-between; gap: 8px;
    font-family: 'Noto Serif Ethiopic', serif; font-size: 14px; color: var(--ink);
    padding: 4px 2px; cursor: pointer; border-radius: 4px;
  }
  .toc-entry:hover { background: rgba(168,123,34,0.1); }
  .toc-entry .toc-num { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 20px; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      position: absolute; top: 0; left: 0; width: 100%;
      background: #fff; color: #000; padding: 40px;
      font-family: 'Noto Serif Ethiopic', serif;
    }
    #printArea h2 { font-size: 22px; margin-bottom: 20px; }
    #printArea pre { white-space: pre-wrap; font-size: 15px; line-height: 1.8; font-family: 'Noto Serif Ethiopic', serif; }
  }

  .divider-face { display: flex; align-items: center; justify-content: center; }
  .divider-content { text-align: center; padding: 0 30px; }
  .divider-orn { font-size: 22px; color: var(--gold); margin: 10px 0; }
  .divider-title {
    font-family: 'Noto Serif Ethiopic', serif; font-weight: 700; color: var(--red);
    font-size: clamp(26px, 5vw, 38px); letter-spacing: 1px;
  }
  .divider-subtitle {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px;
    color: var(--ink-soft); letter-spacing: 2px; text-transform: uppercase; margin-top: 8px;
  }

  .controls { display: flex; align-items: center; gap: 20px; margin-top: 22px; }
  .nav-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--gold);
    background: rgba(201,154,62,0.08); color: var(--parchment); font-size: 20px;
    cursor: pointer; transition: all .15s ease; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: rgba(201,154,62,0.22); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .page-indicator { font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px; color: #C9B98E; min-width: 60px; text-align: center; }

  .share-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .share-btn {
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px;
    background: transparent; border: 1px solid rgba(201,154,62,0.5); color: #C9B98E;
    padding: 6px 16px; border-radius: 99px; cursor: pointer; transition: all .15s ease;
  }
  .share-btn:hover { background: rgba(201,154,62,0.12); }

  .site-footer {
    text-align: center; padding: 14px 20px 30px; color: #8a7a5c;
    font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px;
  }
  .site-footer .signature { color: var(--gold-bright); font-size: 15px; margin-bottom: 4px; letter-spacing: 1px; }

  @media (max-width: 480px) {
    .book { height: min(86vh, 800px); height: min(86svh, 800px); }
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="kicker">A collection, written by hand and heart</div>
    <h1>የፍቅር ግጥሞቼ</h1>
    <div class="sub">ናፍቆት፣ ፍቅር እና ትዝታ በቃላት የተነገሩበት — poems of longing, love, and memory</div>
    <div class="ornament">❦ ❦ ❦</div>
  </div>

  <div class="search-row">
    <input id="searchBox" class="search-input" placeholder="🔍 Search poems…" />
    <button id="dimToggle" class="dim-btn" aria-label="Toggle dim reading mode">🌙</button>
    <button id="soundToggle" class="dim-btn active" aria-label="Toggle page-turn sound">🔊</button>
  </div>

  <nav class="index" id="indexNav"></nav>

  <div class="book-wrap">
    <div class="book-stage">
      <div class="book" id="book"></div>
    </div>
    <div class="book-shadow"></div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Previous page">‹</button>
      <div class="page-indicator" id="pageIndicator">1 / 1</div>
      <button class="nav-btn" id="nextBtn" aria-label="Next page">›</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="share-row">
      <button class="share-btn" id="shareBtn">Share this poem</button>
      <button class="share-btn" id="printBtn">🖨 Print this poem</button>
    </div>
  </div>

  <div class="site-footer">
    <div class="signature">ፍጹም</div>
    <div>Turn the page, or send the whole book — every poem travels together.</div>
  </div>

  <div id="printArea" style="display:none;"></div>

ስራንም ሳይሰሩ ማለምም ትልቅ ሀብት
ምንም የማይጠቅም ነውም አጉል ምኞት።` },
  { tag: "14", title: "ፎቶ ማልነሳው 📸", section: "love", order: 9, body: `ያረጀ ቢመስልም ውቡ አለባበስሽ
ማማርሽን አይቶ ወንደ ሀሉ ቢከብሽ
እኔን ለመማረክ ብዙ ነው ሚቀርሽ።
ብዙ ቢወራልሽ ስላንቺ ቁንጅና
ቢቀደዱልኝም እከሌ ና እንትና
አንቺን እያየሁሽ እዝናናለሁ ገና።
ስለምወድሽ ነው እባክሽ ውድዬ
ስንደዶ ሚመስለው ሰልካካ አፍንጫዬ
ፈራው አንዳይደብቀው  ያንቺን ውበት ብዬ
ፀጉሬስ ብትዪ ሀርን የሚመስለው
ያንቺን ኪንኪ ፀጉር በጣም የሚያስንቀው
እንዲህ የምለፋው እንዲህ የምጥረው
በሀሜተኞች አፍ እንዳትወድቂብኝ ነው
ለእሷ አይመጥንም እሱኮ ቆንጆ ነው
ደረጃዋን ትወቅ እንዳትባዪ ነው
ፎቶ ማልነሳው ሰለምወድሽ ነው።` },
  { tag: "16", title: "የፍቅርሽ ነበልባል ❤️‍🔥", section: "love", order: 10, body: `የ ፍቅርሽ ነበልባል እሳቱ ሲገርፈኝ
ልቤ እንደዚ ሲቀልጥ ትንሽ እንዲቀለኝ
አንቺኑ እያሰብኩ ይሄን ግጥም ፃፍኩኝ።

ናፍቆት እንደ ንፋስ ግለቱን ሲያብሰው
ልቤ እየቀለጠም አንቺን ነው የሚያስበው
ናፍቆትሽ በርትቶ ሲበዛ ቃጠሎው
የፀሐዩ ንዳድ እሱም ተጨምሮ
ከውስጥም ከውጪም እኔን ሲያቃጥለኝ
ደሞዜን ጠብቀሽ ስትመጪም ቢከፋኝ
ምንም ማድረግ ባልችል ሱሴ ሆነሽብኝ
እጄም ባዶ ሲሆን ስትሄጂ ትተሺኝ
ሁልግዜ እያልኩሽ ቶሎ ድረሺልኝ
ልጠብቅሽ እንጂ ምን አማራጭ አለኝ።

እንደዚ እንድኖር አንቺው ፈርደሺብኝ
ምን ጣፋጭ ብትሆኚ እውነቱ ቢመረኝ
በእጆቼ ስይዝሽ ሙቀቱ እንዲለቀኝ
ዝም ብዬ ከምኖር እንደዚ እየሆንኩኝ
እባክሽ ነይ እና ናፍቆትሽ ይውጣልኝ።

ከማረሬ በፊት ሳልስሽ አልቀርም
በጣም እወድሻለሁ ጣፋጯ አይስክሬም።` },
  { tag: "17", title: "እኔ የምሄደው...", section: "love", order: 19, body: `ግጥሜ ናፍቋት ነው?
እሷን ወድጃት ነው?
ለኔስ መጥናኝ ነው?
ስለምትወደኝ ነው?
ወይስ ለማጥናት ነው?
ምከንያቱ ምንድን ነው?
እሷ ጋር ምሄደው እኔ ለምንድን ነው
በሁለቱ ፍቅር ላይ ላለመራመድ ነው
ትንቢተ ፍጹም ን ለማስፈፀምም ነው።
ወንጌል ወንጀል ሆና ወንበሩ ቢያስረኝም
ተጠርጣሪ ብባል ለኔም ቢገርመኝም
እኔ ወድጄ ነው እኔ ፈልጌ ነው
ለነሱ ፍቅር ስል መስዋዕት መሆኔ ነው
ለዚህ ሚያምር ፍቅር መንገድ መክፈቴ ነው
ነው የበዛበትን ግጥምም ምፅፈው።
እኔን የገረመኝ ከመጠርጠሬ ይልቅ
የነሱ መዋደድ እንደዚህ በዚ ልክ
ሰባተኛው ፔሬድ ትንቢቱን ቢያሳካ
ድሮም ከዚህ ቀድሞ ነበር አልቋል ለካ።
አልቋል ብዬ ነበር
ራሴን ሳታልል ላሽ ብዬ ስበርር
አሷ የምትሄደው
ባስኬት ለማየት ነው?
ሜዳው መስጧት ነው?
ወይ ለመጫወት ነው?
ምክንያቱ ምንድንነው?
ሜዳው ጋር ምትሄደው እሱን ለማየት ነው
ሀሁ ብላ ፍቅርን ለመጀመርም ነው
ይህም አለፈና...
እንደተለመደው እሱ እሷን ጀንጅኖ
በቅቤ ምላሱ እትትትትትት ብሎ።
ትንሽ እንደቆዩ የራሱ አደረጋት
በሚያምር ፍቅር ውስጥ አሳለፉ ወራት።
ልደቱን አክብራ የእሷን ግን ረስቶ
ይሄ የማይረባ ይሄ የሰው ጉቶ
ወደ እዚያ መጣል ነው በእርግጫ መቶ።
አሳልፈው ከርመው አንድላይ ለ 1 አመት
ቀጣዩን ስድስት ወር ሊጨማለቅባት
መች እሷ አወቀች እንዲህ እንደሚያደርጋት
ስድስት ወር በሙሉ ለእሷ ጊዜ ሳይሰጥ
ምንም ሳይሰማው ignore እየገጫት
ታግሳ አሳልፋ አንድ ቀን ቢመራት
ና እስኪ ቁጭ ብለን አንዴ እናውራበት
አለችው እና ድንገት...
ምን እንደሚሰማው ከእራሱ ለመስማት
ልጁ ግን ሲሰማው ዱብዳ ሆነበት
ተኮለታተፈ ሚያወራው ጠፋበት
ለካስ...
አላርፍ ያለ አይኑ ደግሞ ሌላ አይቶ
እንዲያ የለፋችበትን ሁሉ መና ከቶ
ሌላዋ ጋር ሄደ ይቺኛዋን ረስቶ።
ፍቅር እንደዚህ ነው ካለ ይህ ሰውዬ
እስኪ አንደ እንበለው ህፃኑ ማሙዬ።
ጡጦ እንስጠው እንጂ ለዚህ ምንም ማያውቅ
አእምሮው ቀጭጮ የሰው ልብ የሚያደርቅ
ይሄ ንገሩኝ ባይ አስመሳይ ጭምልቅ
የማይረባ ዝተት የሰው ልክ የማያውቅ።
ያለማወቅ ጥጉ የታለ ካላቹ
ናቲ ይባላል ልጁ ገላን አለላችሁ።` },
  { tag: "18", title: "እናቴ", section: "family", order: 1, body: `ዘጠኝ ወር በሙሉ እኔን ተሸክመሽ
3 ቀን ሙሉ አምጠሽ ተጨንቀሽም ወልደሽ
ጡትሽን አጥብተሽ አቅፈሽ አሳድገሽ
የደረደርኳቸው ቃላቶች ባይገልጹሽ
እስኪ ትንሽ ልበል ማለቂያ ከሌለው ከብዙ ውለታሽ
ካሉት ሁሉ ቀናት ዛሬን መረጠና
እናቴን አሳየኝ ከራሷ አወጣና
በዛሬዋ ቀንም ቢከበር ልደቴ
ለእናቶች ቀንም ብዬ በአንደበቴ
እንኳን አደረሰሽ እምዬ እናቴ
የዛሬዋ ቀንም የእኔ ብቻ አይደለች
የእኔ እና ያንቺ የጋራችንም ነች
አጠገቤ ባይኖር አባቴ ቢሞት
አንገቴን አልደፋ ለአንዲት ቅጽበት
ምክንያቱም እሱን የሚተካ አለችኝ እናት
በጣም እወድሻለሁ እስከ ዕለተ ሞቴ
ለዘላለም ቆዪ ኑሪልኝ እናቴ 🥰` },
  { tag: "19", title: "ሄ ልቤ", section: "love", order: 2, body: `ምንም ማይበግረኝ ነበርኩኝም ብርቱ
ግን በጣም ይለያሉ እነዚህም ሶስቱ
በዚህ በአለማችን ካሉት ሁሉ ሴቱ።
እንደዚህ ስናገር የተውኳት መስሏችሁ
አብዷል እንዳትሉኝ እናቱን ረሳ ብላችሁ።
ይሄን ትልቅ ነገር እማዬ እናቴን ልረሳ
ይቀላል ትልቁ ተራራ ኤቨረስት ቢነሳ።
ብፈልግ ብኳትን ሆና ፊትለፊቴ
እሷንም አገኘሁ አልኳትም ልዕልቴ።
ሰዎችም ስም ሰጡኝ ከእሷም በኅላ
እያሉ ሄርሞን እኰ ናት የሱ ማር ወለላ።
እንደሱም ካሉ አመት አለፈና
መስኮቱን ዘግቼ ገና ሳልል ቀና
ቤዛ የምትባል አየሁ ስታጠና።
እሷም ጠየቀች ጥያቄ
ቀላልም መሆኑን አውቄ
ቁጭ ብዬም ስሰራ
አየኝ ቃል ከጓዱ ጋራ።
ከዚህም በላይ በቃ አይንዛዛ
ይሄ ሁሉ ነገር አስባለኝም ቤዛ።
ከላይ ያልተሰጡኝ ቢሆኑም ቤዛዬ
ፍቅራቸውን በልቤ ብይዘውም ችዬ
እኔንስ ደክሞኛል መሸከም አዝዬ።
ምንም በልቤ ውስጥ ቢኖራቸው ቦታ
አንድም ሳላቅማማ ሳላስብ ላንድ አፍታ
ሰርዣቸኅለሁ ከልቤገበታ ምን ሳላመነታ።` },
  { tag: "21", title: "ትዕዛዟ", section: "love", order: 6, body: `ኮተቱ ተንኳቶ ተዘርግፎ ከቤት
እረ አትጨቁኚኝ ሚጣ ልኑርበት

እስኪ ሌላም ብላኝ ልገጥም አስቤ

Homework piles growing high like heights.

Another deadline blocks the sun.

Waiting, waiting, trying to believe...

1, 2, 2.5, 3.5… numbers crushing down,

Then came the cruelest joke of all—
"Your second chance? It won't come at all!"

The teacher spoke of Regression's grace,
Yet the exam struck hard—it wiped the smile off our face. 😭

He saw our scores, and sorrow grew,
Yet he smiled, as if he knew.

A lesson taught beyond the page,
That knowledge shines beyond a grade.
"It's just a test, don't lose your way—

And though the struggle took its toll,
We loved you, sir, with all our soul. 🥰`

  { tag: "26", title: "ግንድ ቆርቋሪ ወፍ 🪵🐦‍⬛", section: "love", order: 13, body: `ግንድ ቆርቋሪ ወፍ እርሻዬን ተዪልኝ
ማሳዬን ጨርሰሽ ባዶ አስቀረሽኝ
ደግሞ ሁልጊዜ ሲያብብ እየመጣሽ
በቆሎዬ አልቆ ማሽላዬን ጨረስሽ
ተዪኝ ግን አንቺ ወፍ አንቺ ጥሬ ጠርጥር
የመረረኝ ለታ በባላ ወንጭፌ ክንፍሽን እንዳልሰብር
እኔን እንዳሳረርሽ አትቀሪም ወፏ
አንድ እስካገኝሽ ነው ሕይወቴን የሚከፋ😭` },
  { tag: "21b", title: "ፍጹማዊ ሚዛን ⚖", section: "love", order: 7, body: `ፍርዴን ሳላዳላ እና ሳላጓድል
አለሁ እንደ ድሮ ለእውነት በመታገል
ፍጹም ከሚባል ልጅ ከአንድ ወጣት ጉብል
ስሜ ፍጹማዊ ፤ የማልዋሸው ሚዛን
አንቺ እንድታምኚኝ ምን ላድርግ ንገሪኝ?

— እሷ፦
እኔ ግጥም አልችል፤ ምን ብዬ ልንገርህ?
አንተ በምትችለው አሳምነኝ እባክህ

— እኔ፦
ከዚህ በላይ ግጥም ከወዴት ይገኛል?
አሳምንሽናለሁ፤ አስደምመሽኛል

— እሷ፦
ሰውዬ እንደ ገጣሚ ፊደል ልታስፈልገኝ ነው እንዴ? ሆሆ!

— እኔ፦
ፊደል ለመፈለግ ለምን ትደክሚያለሽ?
«ፍጹማዊ» ሚዛን⚖ እኔ እያለሁልሽ!` },
  { tag: "27", title: "የፍቅር ኮፍያ", section: "love", order: 14,
    titleHtml: `የፍቅር <span class="heart-hat">❤️<span class="hh-cap">🧢</span></span>`,
    body: `ከተደባበሩ ቀናት ቢያሳልፉም
ልደቷን ጠብቆ ቃሉን ለመፈጸም
ፋንዲሻ🍿 ለመሆን ሲስቅ እንደሚኖር ማሽላ ያረረ
ለመጣላት ብሎ የፍቅር ኮፍያ ሊሰጣት በረረ
ባሳለፉት ጊዜ በዚያ ደግ ዘመን
ውዱ ስጦታዋን ቃል የገባላትን
አሁን ግን ቢጣሉም እንደ ድሮ ባይሆን
ለእሷ እሱ ከመስጠት ማን ያስቆመው ይሆን?

የሚያቃጥል ፍቅር❤️‍🔥 የልብ ካወያ
ሳይፈልግ ያሰጣል የፍቅር ኮፍያ

እሱ ከራሱ ጋር ሲያወራ ብቻውን
ሳልፍ በመንገድ ላይ ሰማሁት ያለውን
ንግግሩ ጥሞኝ አየሁ ተመስጬ የተፈጠረውን
እሱ እንደዚህ ይላል፦
«ስህተት እንደሆነ እያወቅኩኝ እኔ
ለማይገባው ሰው መስጠቴ ጨክኜ
ምን ስህተት ቢሆንም የቱንም ብሳሳት
ልክ ነኝ እያልኩኝ መደርደሬ ምክንያት
ቢሆንም ጅልነት ቢሆንም ልጅነት
ቃሌ ቃል ነውና መቼም አልጸጸት»

የሚያቃጥል ፍቅር❤️‍🔥 የልብ ካወያ
ሳይፈልግ ያሰጣል የፍቅር ኮፍያ

«ጥፋት ስታጠፋ ብዙ እየታገስኩ
ይቅርታ በማድረግ ይሁን ብዬ እያለፍኩ
ለመጣላታችን እውነት ቢኖረኝም
ምን እንዳጠፋሁ ግን አልነገረችኝም»
እያለ ያወራል እየተበሳጨ
ይህንንም ብሎ ነገሩን አልቋጨ
አሁንም ቀጥሏል ጽሙን እየነጨ፦
«መውደዴ ጥፋት ነው ላግኝሽ ማለቴ?
ካንቺ ጋር ለመሆን በጽኑ መሻቴ?
እባክሽን ንገሪኝ ምንድነው ስህተቴ?»

የሚያቃጥል ፍቅር❤️‍🔥 የልብ ካወያ
ሳይፈልግ ያሰጣል የፍቅር ኮፍያ

ትንፋሽ ወሰደና አንዴ በረዥሙ
አብረው እንዲሆኑ እስካሁን ማለሙ
«ይበቃኛል» ብሎ ተስፋ በመቁረጥ ውስጥ
ከልቡ አሰማ የዝምታ ጩኸት
እሱ እሷን ለመራቅ ራሱን አሳመነ
ከዛሬ በኋላ ደግሞ ላያገኛት ለራሱ ወሰነ
እንደ ድሮ ሳይሆን አበቃለት በቃ ልቡ ደነደነ
ለትንሽ ደቂቃ ዝምታ ሰፈነ
ተደርጎ የማያውቅ የፍቅር ኮፍያ ለመጣላት ሆነ
አለና በድንገት ዝምታውን ሰብሮ
ከት ብሎ ሳቀ እስኪታይ ጉሮሮ

የሚያቃጥል ፍቅር❤️‍🔥 የልብ ካወያ
ሳይፈልግ ያሰጣል የፍቅር ኮፍያ

ደውሎላት መጣች ስትከፍት ስጦታውን
ልክ እንደጠበቀው እንዳሰበው ሳይሆን
ሊርቃት አስቦ የሰጣት ኮፍያ
ከጎኑ አስቀራት እሷን ከእሱ ጉያ
አወይ ግን ኮፍያ!🧢` },
  { tag: "28", title: "ልዕልቴ", section: "love", order: 8, body: `«እስካሁን ስታያት ፍቅር ይሰማሃል?» አሉኝ ጓደኞቼ
አዎም ስላቸው «እሷን የወደድካት እንዴት ነበር መቼ?»
እንደዚህም ብለው ጥያቄ አነሱ
በደንብም አዳምጡኝ ይኸውና መልሱ

መቼ ይመስላችኋል የተሰማኝ ይሄ?
ከሁለት ዓመት በፊት ነበር እኮ ያኔ
ስለዛችም ቀን ስሙኝ ላጫውታችሁ
ይህንን እውነት እንዲህ ላስታውሳችሁ
በዛች Maths ፔሬድ መልሱን ያልሰራችሁ
ሂካም እንዲህ አለ «ተነሱና ውጡ ከመቀመጫችሁ!»
በክፍል የቀረው አምስት ሰው ነበረ
የወጡትንም ሰው ሂካም ዘረዘረ
«አስፈርማለሁም» ብሎ ዝቶ ዞረ
ከዛንም ቀጥሎ ማስተማር ጀመረ
ቀረ የእኔም አንገት እንዳቀረቀረ
ለምንስ ብላችሁ ጠይቁኝ ጥያቄ
መልሱንም ስመልስ እንዲህ ተጠንቅቄ
ከልጆቹ መሀል መኖሯን አውቄ

በእረፍት ሰዓት እየሄድኩኝ ሳለ ቁርሴንም ልበላ
ስታልቅስ አየኋት ያለምንም ዱላ
ስታናግረውም እንባን አስከትላ
ከእሷ የወረደው የእንባ ዘለላ
ልቤንም ከለለው እንደ ሾላ ጥላ
የከለለው ነገር ፍቅር ነበር ለካ
ከዛ ቀን ጀምሮ ውስጤ ግን ተነካ

የውስጤን ቆርጬ ልነግራትም አሰብኩ
ይሄን አጋጣሚ መጠቀምም ፈለግኩ
መጣች... በመለያያ ቀን «ስለ እኔ ጻፍ» ብላ
ብጽፍም የውስጤን ወሰደው ወሮበላ
ሙሌ በሚባል ልጅ ሀሳቤ ከሸፈ
ልናገርም ሳስብ ልቤ እሺ ብሎ አፌ ተሸነፈ

ይኸው እንደዚህ ነው የፍቅር ታሪኬ
ሆና አግኝቻታለሁ ለእኔ የተሰራች ለራሴ በልኬ
በአንድ ድምፅ ሆናችሁ «ከዛስ?» ብትሉ
ይህን ግጥም ጻፍኩት...
ይህን ግጥም ጻፍኩት ከመጣላት ብዬ የጻፍኩት ሥዕሉ
እስከ ዘላለሙ በጣም እወድሻለሁ
መልስሽን በቴሌ ✈️ ማታ እጠብቃለሁ!` },
  { tag: "29", title: "እስኪ ረጋ...", section: "reflection", order: 5, body: `ለምን ታሾፋለህ በሕይወት?
እሷ እኮ የዓለም ቁልፍ ናት
ቁልፉ ከሌለ በምን ልከፍተው?
ወገኔ ተጠንቀቅ አላማህን እወቀው!
ስትሄድ ስትሻገር በመንገዱ ላይ
በጣም የሚያስቸኩል ቢኖርህ ጉዳይ
እባክህ ተጠንቀቅ አንተ ሰው ሆይ!
ሁልጊዜም ቢሆን ሁን አስተዋይ
ድሮስ የቸኮለ መቼ ደረሰ?
እሱ ለራሱ ጉድጓዱን ማሰ
ለምን ይድረስህ የእሱ ዕጣፈንታ?
መቀየር ስትችል ውጤቱን በርጋታ
ስማኝ ልንገርህ አንተ አሽከርካሪ
እባክህ ከጠጣህ አትያዝ መሪ
ምክንያት እንዳትሆን ለሕይወት መጥፋት
ጠጥተህ እትንዳ እባክህ አስብበት
ማሰብ ብቻ አይደለም ቁረጥ ወስንበት!
ኧረ አንተ ሰው ችግርህ ምንድን ነው?
የሆነው ደግሞም በምክንያት ነው
ፍጥነትህን ቀንሰህ በዝግታ አሽከርክር
በኋላ እንዳትገባ ከማትወጣው ችግር
ልለምንህ ጓዴ እንዳትሆን እንቅፋት
ትርፉም ነውና የሕሊና ጸጸት!` },
  { tag: "30", title: "ተምረናል አሉ", section: "satire", order: 4, body: `ተማርኩ የሚለውን KT² ን እዩት
ጉራውን የሚነፋ የሌለውም ሀፍረት

const MAX_LINES_PER_PAGE = 24;

function chunkBody(poem) {
  if (poem.single) return [poem.body];
  const body = poem.body;
  const paragraphs = body.split(/\n\s*\n/);
  const units = [];
  paragraphs.forEach((p) => {
    const lines = p.split("\n");
    if (lines.length > MAX_LINES_PER_PAGE) {
      for (let i = 0; i < lines.length; i += MAX_LINES_PER_PAGE) {
        units.push(lines.slice(i, i + MAX_LINES_PER_PAGE).join("\n"));
      }
    } else {
      units.push(p);
    }
  });

  const chunks = [];
  let current = [];
  let currentLines = 0;
  units.forEach((u) => {
    const uLines = u.split("\n").length;
    if (currentLines + uLines > MAX_LINES_PER_PAGE && current.length > 0) {
      chunks.push(current.join("\n\n"));
      current = [];
      currentLines = 0;
    }
    current.push(u);
    currentLines += uLines + 1;
  });
  if (current.length) chunks.push(current.join("\n\n"));
  return chunks.length ? chunks : [body];
}

// Build the reading order: group poems by section, sorted within each
// section by their "order" field, and record each poem's original
// RAW_POEMS array index so nav clicks / share still resolve correctly.
const BOOK_ORDER = [];
SECTIONS.forEach((sec) => {
  const group = [];
  RAW_POEMS.forEach((poem, idx) => {
    if (poem.section === sec.key) group.push(idx);
  });
  group.sort((a, b) => RAW_POEMS[a].order - RAW_POEMS[b].order);
  BOOK_ORDER.push({ section: sec, poemIndexes: group });
});

    const poem = RAW_POEMS[poemIndex];
    const chunks = chunkBody(poem);
    firstPageIndexForPoem[poemIndex] = PAGES.length;
    chunks.forEach((chunk, partIndex) => {

});

function layout() {
  pageEls.forEach((page, i) => {
    if (i < current) {
      page.classList.add("flipped");
      page.style.zIndex = i;
    } else {
      page.classList.remove("flipped");
      page.style.zIndex = PAGES.length - i;
    }
  });
  pageIndicator.textContent = (current + 1) + " / " + PAGES.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PAGES.length - 1;
  const progressFill = document.getElementById("progressFill");
  if (progressFill) {
    progressFill.style.width = (((current + 1) / PAGES.length) * 100) + "%";
  }
  const activePoemIndex = PAGES[current].poemIndex;
  document.querySelectorAll(".index button").forEach((b) => {
    b.classList.toggle("active", parseInt(b.dataset.poemIndex, 10) === activePoemIndex);
  });
}

function fitPageText(page) {
  const content = page.querySelector(".page-content");
  const body = page.querySelector(".poem-body");
  if (!content || !body) return;

  body.style.fontSize = "";
  body.style.lineHeight = "";
  const maxSize = parseFloat(getComputedStyle(body).fontSize);
  const baseLineHeight = 1.85;
  let size = maxSize;
  let guard = 0;

  while (content.scrollHeight > content.clientHeight + 1 && size > 11 && guard < 60) {
    size -= 0.5;
    body.style.fontSize = size + "px";
    guard++;
  }

  let lh = baseLineHeight;
  guard = 0;
  while (content.scrollHeight > content.clientHeight + 1 && lh > 1.3 && guard < 30) {
    lh -= 0.05;
    body.style.lineHeight = lh.toFixed(2);
    guard++;
  }
}
function fitAllPages() {
  pageEls.forEach(fitPageText);
}

function next() { if (current < PAGES.length - 1) { current++; layout(); fitPageText(pageEls[current]); playPageTurnSound(); } }
function prev() { if (current > 0) { current--; layout(); fitPageText(pageEls[current]); playPageTurnSound(); } }
function goTo(i) {
  const target = Math.max(0, Math.min(PAGES.length - 1, i));
  if (target === current) return;
  current = target;
  layout();
  fitPageText(pageEls[current]);
  playPageTurnSound();
}

prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});

let touchStartX = null;
book.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
book.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
  touchStartX = null;
}, { passive: true });

    try { await navigator.share({ title: poem.title, text: text }); return; } catch (e) {}
  }
  try {
    await navigator.clipboard.writeText(text);
    const old = shareBtn.textContent;
    shareBtn.textContent = "Copied ✓";
    setTimeout(() => (shareBtn.textContent = old), 1400);
  } catch (e) {}
});

/* ---------- Print current poem ---------- */
const printBtn = document.getElementById("printBtn");
printBtn.addEventListener("click", () => {
  if (PAGES[current].poemIndex === undefined) return;
  const poem = RAW_POEMS[PAGES[current].poemIndex];
  const printArea = document.getElementById("printArea");
  printArea.innerHTML = `<h2>${poem.title.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").trim()}</h2><pre>${poem.body}</pre>`;
  window.print();
});

/* ---------- Search / filter nav ---------- */
const searchBox = document.getElementById("searchBox");
searchBox.addEventListener("input", () => {
  const q = searchBox.value.trim().toLowerCase();
  const groups = nav.querySelectorAll(".section-group");

  groups.forEach((group) => {
    const poemButtons = group.querySelectorAll(".section-poems button");
    let anyVisible = false;
    poemButtons.forEach((btn) => {
      const match = !q || btn.textContent.toLowerCase().includes(q);
      btn.style.display = match ? "" : "none";
      if (match) anyVisible = true;
    });
    group.style.display = anyVisible ? "" : "none";
    if (q) {
      group.classList.toggle("expanded", anyVisible);
    } else {
      group.classList.remove("expanded");
    }
  });
});

/* ---------- Page-turn sound — synthesized in-browser, no audio file ---------- */
let audioCtx = null;
let soundEnabled = true;

function playPageTurnSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    const now = audioCtx.currentTime;
    const duration = 0.24;

    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const bandpass = audioCtx.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.Q.value = 0.7;
    bandpass.frequency.setValueAtTime(1000, now);
    bandpass.frequency.exponentialRampToValueAtTime(3200, now + duration * 0.45);
    bandpass.frequency.exponentialRampToValueAtTime(700, now + duration);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.32, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    noise.connect(bandpass);
    bandpass.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + duration);
  } catch (e) { /* audio unsupported — fail silently */ }
}

const soundToggle = document.getElementById("soundToggle");
soundToggle.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
  soundToggle.classList.toggle("active", soundEnabled);
  if (soundEnabled) playPageTurnSound();
});

/* ---------- Dim reading mode ---------- */
const dimToggle = document.getElementById("dimToggle");
dimToggle.addEventListener("click", () => {
  document.body.classList.toggle("dim-mode");
  dimToggle.classList.toggle("active");
});

layout();

window.addEventListener("load", fitAllPages);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(fitAllPages);
}
let resizeTimer;
function scheduleFit() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitAllPages, 120);
}
window.addEventListener("resize", scheduleFit);
window.addEventListener("orientationchange", scheduleFit);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", scheduleFit);
}
if (window.ResizeObserver) {
  new ResizeObserver(scheduleFit).observe(book);
}
setTimeout(fitAllPages, 50);
setTimeout(fitAllPages, 400);
</script>
